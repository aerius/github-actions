name: "Build Docker images for a generic AERIUS project"
description: "Build Docker images for a AERIUS project"

inputs:
  GITHUB_TOKEN:
    required: true
    description: "Just pass the secrets.GITHUB_TOKEN to this action as input."
  DOCKER_IMAGE_NAME:
    required: true
    description: "The Docker image name to use when building."
  DOCKER_WORK_DIRECTORY:
    required: false
    description: "The Docker work directory."
    default: "repo"
  DOCKERFILE_LOCATION:
    required: false
    description: "The location of the Dockerfile inside the Docker work directory."
    default: "Dockerfile"
  DOCKER_BUILD_PLATFORMS:
    required: false
    description: "The platforms to build for, e.g.: linux/amd64,linux/arm64"
    default: ""

runs:
  using: "composite"
  steps:
    - uses: ./aerius-github-actions/common/checkout
      with:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}

    - uses: ./aerius-github-actions/common/init-docker
      with:
        DOCKER_BUILD_PLATFORMS: ${{ inputs.DOCKER_BUILD_PLATFORMS }}

    - uses: ./aerius-github-actions/common/build-using-docker
      with:
        DOCKER_IMAGE_NAME: ${{ inputs.DOCKER_IMAGE_NAME }}
        DOCKER_WORK_DIRECTORY: ${{ inputs.DOCKER_WORK_DIRECTORY }}
        DOCKERFILE_LOCATION: ${{ inputs.DOCKERFILE_LOCATION }}
        DOCKER_BUILD_PLATFORMS: ${{ inputs.DOCKER_BUILD_PLATFORMS }}

