name: "common :: Build using Maven"
description: "common :: Build using Maven - requires checkout-java to be run before"

inputs:
  GITHUB_TOKEN:
    required: true
    description: "Just pass the secrets.GITHUB_TOKEN to this action as input."
  ROOT_POM_DIRECTORY:
    required: true
    description: "The directory where the root POM can be found."
  IGNORE_TEST_FAILURES:
    required: true
    description: "Whether to ignore test failures."
  MAVEN_BUILD_PROFILE:
    required: true
    description: "The maven profile(s) to use."

runs:
  using: "composite"
  steps:
    - name: Build using Maven
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
      shell: bash
      run: mvn -f ${{ inputs.ROOT_POM_DIRECTORY }}/pom.xml -Dmaven.test.failure.ignore=${{ inputs.IGNORE_TEST_FAILURES }} -P ${{ inputs.MAVEN_BUILD_PROFILE }} verify

