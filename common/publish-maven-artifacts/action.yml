name: "common :: Publish Maven Artifacts"
description: "common :: Publish Maven Artifacts - requires checkout-java to be run before"

inputs:
  NEXUS_USERNAME:
    required: true
    description: "The Nexus username needed to publish packages."
  NEXUS_PASSWORD:
    required: true
    description: "The Nexus password needed to publish packages."
  POM_PUBLISH_REPOSITORY_NAME:
    required: true
    description: "The repository as specified in the root POM to publish to."
  ROOT_POM_DIRECTORY:
    required: true
    description: "The directory where the root POM can be found."
  MAVEN_PUBLISH_PROFILE:
    required: true
    description: "The maven profile(s) to use."

runs:
  using: "composite"
  steps:
    - name: Publish Maven Artifacts
      shell: bash
      env:
        INPUT_SERVER_ID: ${{ inputs.POM_PUBLISH_REPOSITORY_NAME }}
        INPUT_NEXUS_USERNAME: ${{ inputs.NEXUS_USERNAME }}
        INPUT_NEXUS_PASSWORD: ${{ inputs.NEXUS_PASSWORD }}
      run: |
        mvn deploy \
          --settings aerius-github-actions/resources/maven_publish_settings.xml \
          --batch-mode \
          -P deploy,${{ inputs.MAVEN_PUBLISH_PROFILE }} \
          -DskipTests \
          -f ${{ inputs.ROOT_POM_DIRECTORY }}/pom.xml
