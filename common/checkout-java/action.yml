name: "common :: Checkout Java"
description: "common :: Checkout repository and setup Java (JDK / Maven)"

inputs:
  GITHUB_TOKEN:
    required: true
    description: "Just pass the secrets.GITHUB_TOKEN to this action as input."
  JDK_VERSION:
    required: true
    description: "The version of the JDK to setup."
  POM_PUBLISH_REPOSITORY_NAME:
    required: false
    description: "The repository as specified in the root POM to publish to. Only needed for publishing."
    default: non-existent-server-id

runs:
  using: "composite"
  steps:
    - uses: ./aerius-github-actions/common/checkout
      with:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}

    - name: Setup Java (JDK / Maven)
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.JDK_VERSION }}
        distribution: temurin
        cache: maven
        server-id: ${{ inputs.POM_PUBLISH_REPOSITORY_NAME }}
        server-username: NEXUS_USERNAME
        server-password: NEXUS_PASSWORD
